# Backend on :8000, frontend on :8501.
# One image is built once and used by both services, so starting does not reinstall packages.
# The image is multi architecture and builds on arm64 (Apple silicon, Raspberry Pi 64 bit).
# The CAN gateway is NOT part of this file. It runs directly on the Pi host so it can reach
# the CAN interfaces and GPIO. The dashboard container reads its state page from the host.
name: secondpulse

x-app-build: &app-build
  context: .
  dockerfile_inline: |
    FROM python:3.11-slim
    WORKDIR /app
    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt
    COPY . .

services:
  backend:
    build: *app-build
    image: secondpulse:local
    working_dir: /app
    volumes:
      - .:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    image: secondpulse:local
    working_dir: /app
    volumes:
      - .:/app
    environment:
      BACKEND_URL: http://backend:8000
      GATEWAY_URL: ${GATEWAY_URL:-http://host.docker.internal:8100}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
